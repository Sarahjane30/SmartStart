[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartstart"
version = "0.1.0"
description = "SmartStart — Layer 1 synthetic data engine for neonatal HIE multimodal research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SmartStart contributors" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
smartstart = "smartstart.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/smartstart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
