[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartstart"
version = "0.6.0"
description = "SmartStart — synthetic onboarding orchestration (Layers 1–4) + IRA desktop companion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.6",
  "faker>=26.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
ira = [
  "PySide6>=6.6",
]

[project.scripts]
ira = "ira.app:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "icims", "servicenow", "jira", "ira"]

[tool.pytest.ini_options]
testpaths = ["tests", "icims/tests", "servicenow/tests", "jira/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
